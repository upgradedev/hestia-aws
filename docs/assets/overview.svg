<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696" role="img" aria-labelledby="title desc">
<title id="title">Hestia architecture overview</title>
<desc id="desc">A household member opens the React web app in a browser, with no account and a private copy that lasts 30 minutes. In AWS region eu-west-1 the hestia-frontend CloudFormation stack holds Amazon CloudFront, which serves the app files from a private Amazon S3 site bucket through origin access control and forwards /api, /api/*, /healthz and /action/* to the hestia-afh-api stack. There an Amazon API Gateway HTTP API sends the $default route to the read-only AWS Lambda reader, which answers only GET and OPTIONS, and 22 POST routes to the AWS Lambda writer. The reader reads the S3 state bucket, which keeps one JSON document per private copy, and the writer saves to it with conditional writes. The writer runs the two Strands agents, for review and reading, which call Claude Haiku 4.5 on Amazon Bedrock through an EU inference profile. Not connected: Amazon SES email, which IAM denies, and bank or mailbox feeds.</desc>
