<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="912" viewBox="0 0 1200 912" role="img" aria-labelledby="title desc">
<title id="title">Hestia household request flow</title>
<desc id="desc">Seven numbered household steps, each a POST route on the writer AWS Lambda function. 1. Open a private copy with POST /api/demo/session, which returns a 30-minute capability. 2. Add and confirm records with POST /api/ingest/sync: stage, review, then commit with confirmed true. 3. The reading agent proposes records from pasted text with POST /api/agent/extract and stages them as a draft for the same review. 4. The review agent writes a briefing with POST /api/agent/review. Both Strands agents call Claude Haiku 4.5 on Amazon Bedrock. The briefing is advice and does not gate the notice. 5. Review the exact notice with POST /api/action/claim/prepare, a deterministic template offered for any appliance with a committed repair. 6. Approve it with POST /api/action/claim and a single-use token; the approval is recorded as SIMULATED and no email is sent. 7. Update the case file with POST /api/case/update. Steps 1, 2, 5, 6 and 7 are deterministic Python. Every step saves one state.json per private copy in Amazon S3 with conditional writes, including the reading agent's draft and the review agent's briefing and trace. Not connected: Amazon SES email, where the dispatch route answers 403, and bank or mailbox feeds.</desc>
