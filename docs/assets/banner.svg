<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
<title id="title">Hestia: records you add, an agent review, a notice you approve</title>
<desc id="desc">Hestia keeps a household's receipts, guarantees and repair cases together, in three steps from left to right. Step 1, records you add: receipts, guarantees and repairs, saved only after you confirm them. Step 2, agent review: a Strands agent on Amazon Bedrock reads the records and points at the decisions waiting. Step 3, notice you approve: the approval is recorded and the notice is not sent.</desc>
