<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="952" viewBox="0 0 1200 952" role="img" aria-labelledby="title desc">
<title id="title">Hestia release path</title>
<desc id="desc">Two release lanes that meet at the live site. Backend lane: on GitHub Actions, ci.yml builds and tests the backend and keeps the Lambda zip, the rendered template and SHA256SUMS. On the operator host, scripts/release_backend.py runs prepare, execute and verify: it takes that artifact from a successful main run, uploads the zip once to the S3 deploy bucket under one key per commit, and prints a CloudFormation change set on the hestia-afh-api stack for review. The execute step prepares and prints a new change set and executes it with automatic rollback on; both Lambda functions take their code from the deploy bucket and carry the commit. Web app lane: on GitHub Actions, the release job of frontend-deploy.yml runs only when started by hand on main. It builds the app, assumes the IAM release role through GitHub OIDC, a role that trusts only the main branch, puts the files into the S3 site bucket of the hestia-frontend stack, invalidates the CloudFront cache and runs a smoke test. The hestia-afh-api stack serves the API and the hestia-frontend stack the web app of the live site, whose /healthz names the deployed commit. On GitHub Actions, production-acceptance.yml is started by hand on main after a release, an order the workflow does not enforce, and runs one phase per run, backend or frontend, against the live site. Not connected: no workflow holds AWS credentials for the API stack, and frontend-deploy.yml does not deploy the API.</desc>
