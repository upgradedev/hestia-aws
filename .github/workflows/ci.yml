name: ci

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff check
        run: |
          python -m ruff check src tests infra

      - name: run test suite with coverage
        run: |
          python -m compileall -q src tests
          python -m pytest --cov=hestia --cov-branch --cov-fail-under=85 --cov-report=term-missing --cov-report=xml --junitxml=pytest-results.xml tests/ infra/

      - name: Retain exact-revision test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-p0-evidence
          path: |
            coverage.xml
            pytest-results.xml
          if-no-files-found: warn
