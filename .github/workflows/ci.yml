name: ci

on:
  push:
    branches: [main, "build/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff check
        run: |
          python -m ruff check src tests infra scripts/ci_api_server.py scripts/deploy_api.py tools/measure.py tools/ablate.py

      - name: run test suite with coverage
        run: |
          python -m compileall -q src tests
          python -m pytest --cov=hestia --cov-branch --cov-fail-under=85 --cov-report=term-missing --cov-report=xml --junitxml=pytest-results.xml tests/ infra/

      - name: Retain executed synthetic measurements without rewriting history
        run: |
          mkdir -p build
          python tools/measure.py --output build/synthetic-measurement.json
          python tools/ablate.py --output build/synthetic-ablation.json
          python -c "import os,json,datetime; print(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'mode':'synthetic_ci','human_uat':'NOT_RUN','live_model':False,'live_send':False}))" > build/verification-context.json

      - name: Retain exact-revision test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-p0-evidence
          path: |
            coverage.xml
            pytest-results.xml
            build/synthetic-measurement.json
            build/synthetic-ablation.json
            build/verification-context.json
          if-no-files-found: warn

      - name: Package isolated demo runtime without AWS access
        run: |
          python -c "from scripts.deploy_api import package; package()"
          cd build/pkg
          python -S -c "from hestia.app.web import lambda_handler; import json; response=lambda_handler({'rawPath':'/healthz','requestContext':{'http':{'method':'GET'}}},None); health=json.loads(response['body']); assert response['statusCode']==200 and health['live_send'] is False and health['live_model'] is False"

      - name: Render exact-revision deployment configuration in CI
        run: |
          python infra/hestia_api_stack.py > build/hestia-api-stack.json
          cd build
          sha256sum hestia-api.zip hestia-api-stack.json > SHA256SUMS

      - name: Retain candidate runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-runtime-candidate
          path: |
            build/hestia-api.zip
            build/hestia-api-stack.json
            build/SHA256SUMS
          if-no-files-found: error
