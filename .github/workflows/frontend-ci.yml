name: Frontend verification
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_DEFAULT_REGION: eu-west-1
      AWS_EC2_METADATA_DISABLED: 'true'
      HESTIA_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin CI npm package manager
        run: npm install --global npm@11.19.1

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Install Frontend Dependencies in CI
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
          npm ci

      - name: Build React Application
        working-directory: frontend
        run: npm run build

      - name: Install isolated browser runtime in CI
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Exercise browser journeys against the real API boundary
        run: |
          mkdir -p frontend/test-results
          CI=true python scripts/ci_api_server.py --port 8000 > frontend/test-results/api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --port 3000 --strictPort > frontend/test-results/vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/healthz
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/
          npm --prefix frontend run test:e2e
          cd frontend
          HESTIA_ACCEPTANCE_URL=http://127.0.0.1:3000 HESTIA_ACCEPTANCE_PHASE=frontend HESTIA_APPROVED_SHA="$GITHUB_SHA" npx --no-install playwright test --config playwright.acceptance.config.ts

      - name: Retain browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-p0-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/acceptance-results/
            frontend/acceptance-report/
            frontend/package-lock.json
          if-no-files-found: warn

      - name: Upload Built Frontend Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

      - name: Lint Python Code
        run: ruff check src/ tests/ infra/

      - name: Python Regression & Hosting Tests
        run: pytest -q --cov=hestia tests/ infra/test_frontend_hosting.py
