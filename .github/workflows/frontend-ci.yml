name: Frontend verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin CI npm package manager
        run: npm install --global npm@11.19.1

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Install Frontend Dependencies in CI
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
          npm ci

      - name: Build React Application
        working-directory: frontend
        run: npm run build

      - name: Upload Built Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

      - name: Lint Python Code
        run: ruff check src/ tests/ infra/

      - name: Python Regression & Hosting Tests
        run: pytest -q --cov=hestia tests/ infra/test_frontend_hosting.py
