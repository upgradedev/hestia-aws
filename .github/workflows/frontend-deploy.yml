name: Deploy AWS frontend
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hestia-frontend-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/frontend-ci.yml

  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Verified Revision
        working-directory: frontend
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::308857099262:role/hestia-frontend-release
          aws-region: eu-west-1

      - name: Publish Versioned Assets to S3 and CloudFront
        run: python infra/frontend_publish.py --sha "${{ github.sha }}" --stack hestia-frontend | tee frontend-release.json

      - name: Verify Deployed CloudFront Endpoint
        run: |
          URL=$(python -c 'import json; print(json.load(open("frontend-release.json"))["url"])')
          python infra/frontend_smoke.py --url "$URL" --sha "${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-frontend-release
          path: frontend-release.json
